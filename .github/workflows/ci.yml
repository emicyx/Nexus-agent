name: CI

on:
  push:
    branches: [master, master_server]
  pull_request:

jobs:
  backend-unit:
    name: Backend 单测（无外部依赖）
    runs-on: ubuntu-latest
    env:
      # 仅初始化 Settings 用，单测不发真实 LLM 请求
      QWEN_API_KEY: sk-ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与 backend/Dockerfile 的 python:3.11-slim 对齐（测试运行时=交付运行时）
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Run unit tests
        run: python -m pytest testing/unit -q

  backend-integration:
    name: Backend 集成（compose 起 PG/Redis）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QWEN_API_KEY: sk-ci-dummy
      # 用应用账号（非 superuser）连接：顺带验证 init.sh 的授权是否充分
      POSTGRES_DSN: postgresql://nexus_app:nexus_app@localhost:5432/nexus
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与 backend/Dockerfile 的 python:3.11-slim 对齐（测试运行时=交付运行时）
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio
      # postgres 镜像含 zhparser（首次构建需编译，约 3-5 分钟）
      - name: Start postgres + redis
        run: |
          # compose 引用 .env（backend 的 env_file）；CI 上从模板生成一份（仅起 PG/Redis，值不敏感）
          cp .env.example .env
          docker compose up -d --build postgres redis
      - name: Wait for postgres healthy
        run: |
          # 2026-09-17 实测记录：CI runner 上 initdb+init.sh 可能远慢于本机（本机 6-45s），
          # 曾 150s 等不到 healthy——等 5 分钟，超时必须打容器日志让失败可诊断
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q postgres) 2>/dev/null || echo starting)
            echo "postgres: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 5
          done
          echo "::group::postgres container logs (wait timeout)"
          docker logs $(docker compose ps -q postgres) 2>&1 | tail -60
          echo "::endgroup::"
          exit 1
      # 迁移链验证：0001→head 必须能在干净库上完整执行
      # （此前 create_all 掩盖了模型与迁移漂移，如 chat_session_summaries 曾缺迁移）
      - name: Verify alembic migrations on clean DB
        working-directory: backend
        run: alembic upgrade head
      - name: Run integration tests
        run: python -m pytest testing/integration -q

  frontend:
    name: Frontend 类型检查 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
